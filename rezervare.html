<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Rezervă o masă - Cafeneaua Luna</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Rezervă o masă ☕</h1>

    <p>Completează formularul și te așteptăm la Cafeneaua Luna!</p>

    <form>
        <label>Nume:</label>
        <input type="text" placeholder="Numele tău">

        <label>Telefon:</label>
        <input type="tel" placeholder="07xx xxx xxx">

        <label>Data:</label>
        <input type="date">

        <label>Ora:</label>
        <input type="time">

        <label>Număr de persoane:</label>
        <input type="number" min="1" max="10">

        <button type="submit">Trimite rezervarea</button>
   <form id="reservationForm"><p id="successMessage">
    Rezervarea ta a fost trimisă! ☕ Te așteptăm la Cafeneaua Luna!
</p>
<script src="script.js"></script>
</body>
</html>
